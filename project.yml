# Pomolo.xcodeproj を生成するための XcodeGen 設定
# このファイルを変更したら、リポジトリルートで `mint run xcodegen generate` を実行
name: Pomolo

# 生成される .xcodeproj 自体に関わるプロジェクト全体のオプション
options:
  # プロジェクトで使うデフォルトのローカライズ / 開発言語
  developmentLanguage: ja
  # 明示的に指定しない場合に Xcode が選ぶビルド構成
  defaultConfig: Release
  # 同期フォルダに対応した新しい Xcode 形式でプロジェクトを生成
  projectFormat: xcode16_0
  # この設定を作成したときに使っていた Xcode バージョン
  xcodeVersion: "26.5"

# Xcode に表示されるビルド構成
configs:
  Debug: debug
  Release: release

# コンパイル対象ではないものの、Xcode のナビゲータに表示したいファイル
fileGroups:
  - .swift-format
  - project.yml
  - Makefile
  - Mintfile
  - .gitignore
  - README.md

# プロジェクトで使うローカル Swift Package
packages:
  SwiftFormatPlugin:
    # ビルド中に SwiftFormat を実行するための build tool plugin package
    path: BuildTool/SwiftFormatPlugin
  SFSafeSymbols:
    url: https://github.com/SFSafeSymbols/SFSafeSymbols.git
    from: 7.0.0

# 下で上書きしない限り各ターゲットに継承される、プロジェクト共通のビルド設定
settings:
  base:
    # コンパイラ、アナライザ、警告、署名、iOS SDK に関する基本設定
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_NONNULL: YES
    CLANG_ANALYZER_NUMBER_OBJECT_CONVERSION: YES_AGGRESSIVE
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_BLOCK_CAPTURE_AUTORELEASING: YES
    CLANG_WARN_BOOL_CONVERSION: YES
    CLANG_WARN_COMMA: YES
    CLANG_WARN_CONSTANT_CONVERSION: YES
    CLANG_WARN_DEPRECATED_OBJC_IMPLEMENTATIONS: YES
    CLANG_WARN_DIRECT_OBJC_ISA_USAGE: YES_ERROR
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_EMPTY_BODY: YES
    CLANG_WARN_ENUM_CONVERSION: YES
    CLANG_WARN_INFINITE_RECURSION: YES
    CLANG_WARN_INT_CONVERSION: YES
    CLANG_WARN_NON_LITERAL_NULL_CONVERSION: YES
    CLANG_WARN_OBJC_IMPLICIT_RETAIN_SELF: YES
    CLANG_WARN_OBJC_LITERAL_CONVERSION: YES
    CLANG_WARN_OBJC_ROOT_CLASS: YES_ERROR
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_RANGE_LOOP_ANALYSIS: YES
    CLANG_WARN_STRICT_PROTOTYPES: YES
    CLANG_WARN_SUSPICIOUS_MOVE: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CLANG_WARN_UNREACHABLE_CODE: YES
    CLANG_WARN__DUPLICATE_METHOD_MATCH: YES
    COPY_PHASE_STRIP: NO
    DEVELOPMENT_TEAM: 6A43GJY63D
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    MTL_FAST_MATH: YES
    SDKROOT: iphoneos
  configs:
    Debug:
      # Debug ではデバッグ情報を残し、最適化を無効にし、DEBUG コンパイル条件を有効にする
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - DEBUG=1
        - $(inherited)
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited)
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      # Release では whole-module compilation とプロダクト検証を有効にする
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

# プロジェクトに生成される Xcode のネイティブターゲット
targets:
  Pomolo:
    # メインの iOS アプリターゲット
    type: application
    platform: iOS
    sources:
      # Xcode 26 の同期フォルダ。Pomolo/ 配下の Swift、Assets.xcassets、AppIcon.icon がターゲットに含まれる
      - path: Pomolo
        type: syncedFolder
    dependencies:
      - package: SFSafeSymbols
    buildToolPlugins:
      # このアプリターゲットで SwiftFormat の build tool plugin を実行
      - plugin: SwiftFormatPlugin
        package: SwiftFormatPlugin
    settings:
      base:
        # アプリ識別子、生成される Info.plist のキー、App Icon / Asset Catalog 名、Swift 言語設定
        # AppIcon.icon を使うため、App Icon 名は拡張子なしの AppIcon に合わせる
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 6A43GJY63D
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        MARKETING_VERSION: 1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.shofucchi.Pomolo
        PRODUCT_NAME: $(TARGET_NAME)
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
